name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    image: my-mariadb:inception
    container_name: my-mariadb
    restart: always

  wordpress:
    depends_on:
      - mariadb
    build: ./requirements/wordpress
    image: my-wordpress:inception
    container_name: my-wordpress
    restart: always
    volumes:
      - wp-data:/var/www/html

  nginx:
    build: ./requirements/nginx
    image: my-nginx:inception
    container_name: my-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - wp-data:/var/www/html

volumes:
  wp-data:
