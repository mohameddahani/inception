services:
  mariadb:
    build: ./requirements/mariadb
    image: my-mariadb
    container_name: my-mariadb
    restart: always
  nginx:
    build: ./requirements/nginx
    image: my-nginx
    container_name: my-nginx
    restart: always
    ports:
      - "8080:80"





