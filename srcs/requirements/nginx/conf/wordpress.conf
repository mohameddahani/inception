# This block is required by Nginx and controls how it handles connections (low-level settings).
events {}

# This block contains everything related to HTTP (web traffic).
http {

    # This defines one website (server / virtual host).
    server {

        # Nginx listens for incoming HTTP requests on port 80.
        listen 80;

        # The domain name for this server (used to match incoming requests).
        server_name localhost;

        # The root directory where your website files are stored.
        root /var/www/html;

        # Default files to serve when a directory is requested (e.g., "/").
        index index.php index.html;

        # This block handles ALL incoming requests ("/" means everything).
        location / {

            # Try to find the requested file:
            # 1. $uri      → exact file (e.g., /style.css)
            # 2. $uri/     → directory (e.g., /images/)
            # 3. fallback  → send request to index.php (used by WordPress routing)
            try_files $uri $uri/ /index.php?$args;
        }

        # This block handles all files ending with ".php".
        location ~ \.php$ {

            # Include standard FastCGI parameters (headers, request info, etc.).
            include fastcgi_params;

            # Send PHP requests to the PHP-FPM container named "wordpress" on port 9000.
            fastcgi_pass wordpress:9000;

            # Tell PHP which file to execute:
            # Combines root (/var/www/html) + requested file (e.g., /index.php)
            # Example result: /var/www/html/index.php
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
