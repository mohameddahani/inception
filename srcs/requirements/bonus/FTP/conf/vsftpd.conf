# Active mode (old):
# client → server:21 (commands)
# server → client (server initiates data connection) ← blocked by firewalls

# Passive mode (modern):
# client → server:21 (commands)
# client → server:PASV_PORT (client initiates data) ← works through firewalls

# ============================================
# BASIC SETTINGS
# ============================================

# Point to the WordPress files
local_root=/var/www/html

# Allow local system users to login
local_enable=YES

# Allows users to:
# upload files
# delete files
# create folders
# modify files
write_enable=YES

# Run as standalone server (not via inetd)
# “Start the FTP server as a standalone process and listen for incoming connections on a network port (usually port 21).”
listen=YES

# Disable anonymous login (security)
# Enable only system users to login
anonymous_enable=NO

# ============================================
# PASSIVE MODE SETTINGS
# ============================================

# Enable passive mode
pasv_enable=YES

# Passive mode port range
# client will connect on one of these ports for data
pasv_min_port=21100
pasv_max_port=21110

# ============================================
# USER SETTINGS
# ============================================

# Jail users inside their home directory
# user cannot go above their home folder
chroot_local_user=YES

# Required when chroot is enabled
allow_writeable_chroot=YES
